services:
  - type: web
    name: warhammer-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /legions
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URL
        sync: false
      - key: FRONT_URL
        sync: false
