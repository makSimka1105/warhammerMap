name: warhammer-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/warhammer
      FRONT_URL: http://client:3000
      PORT: 5000
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        API_ORIGIN: http://server:5000
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/warhammer
      BETTER_AUTH_URL: ${PUBLIC_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-WarhammerMap}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-}
    ports:
      - "${HTTP_PORT:-3000}:3000"
    depends_on:
      - server

volumes:
  mongo-data:
